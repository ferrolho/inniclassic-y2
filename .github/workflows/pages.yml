# Deploys the product site in site/ to GitHub Pages.
# Repository settings: Pages → Build and deployment → Source: GitHub Actions. The github-pages environment must
# allow the branch that deploys (our fork: site/classy2).
name: Pages

on:
  push:
    branches: [main, site/classy2]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
